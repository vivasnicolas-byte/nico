<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f172a;
  color:white;
  font-family:Arial, sans-serif;
  padding:40px 20px;
  line-height:1.7;
}

.container{
  max-width:1000px;

h1{

.section-title{

  color:#38bdf8;
  font-size:1.8rem;
  border-left:5px solid #38bdf8;
  padding-left:15px;

.image-box{
  background:#1e293b;
  border-radius:18px;
  padding:20px;
  margin-bottom:35px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.image-box:hover{
  transform:translateY(-5px);
}

.pyc{
  width:100%;
  border-radius:12px;
  display:block;
}

a{
  display:inline-block;
  margin-top:30px;
  padding:12px 20px;
  background:#38bdf8;
  color:#0f172a;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  transition:0.3s;
}

a:hover{
  background:#7dd3fc;
}

</style>
